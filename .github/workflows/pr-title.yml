name: PR title

# Squash merges use the PR title as the commit subject, so the title must be a
# conventional commit to keep the history readable and the changelog scannable.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a conventional commit, e.g. 'feat(ledger): add account balance' or 'fix!: rename Posting.amount'. Got: $TITLE"
            exit 1
          fi
