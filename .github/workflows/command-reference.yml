name: Command reference

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-reference:
    name: Command reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A pull request compares its own head with the merge base, so the whole history is fetched.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compare with the published CLI
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          if [ -n "$BASE_REF" ]; then
            baseline="$(git merge-base "origin/$BASE_REF" HEAD)"
            bun run check:command-reference --baseline "$baseline" > "$RUNNER_TEMP/drift.txt" 2>&1
          else
            bun run check:command-reference > "$RUNNER_TEMP/drift.txt" 2>&1
          fi
          status=$?
          cat "$RUNNER_TEMP/drift.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Find the open drift issue
        id: drift
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --state open --json number,title \
            --jq '.[] | select(.title == "Command reference drift") | .number' | head -n 1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: File the drift as an issue
        if: steps.check.outputs.status == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.drift.outputs.number }}
        run: |
          {
            echo "The published \`@trajectonomics/cli\` and the command reference disagree."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift.txt"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Command reference drift" --label needs-triage \
              --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Close the drift issue once the reference is clean
        if: steps.check.outputs.status == '0' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.drift.outputs.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "The command reference matches the published CLI again."
          fi

      - name: Fail on drift
        if: steps.check.outputs.status != '0'
        run: exit 1
