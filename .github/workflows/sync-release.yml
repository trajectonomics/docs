name: Docs Sync

# An Upstream Package publishes a release, cicd dispatches `upstream_release` here with
# `{ repo, tag, changelog }`, and Docs Sync proposes the documentation edits as a DRAFT pull
# request. It never commits to `main`: a maintainer reviews and merges every change.
#
# A draft opened with the workflow's `GITHUB_TOKEN` does not trigger other workflows, so CI does
# not run on it. Reviewers run `bun run check` before merging, or the job uses a token that can
# trigger workflows.
on:
  repository_dispatch:
    types: [upstream_release]

permissions:
  contents: write
  pull-requests: write

# One proposal at a time per Upstream Package, so two releases of the same package cannot race
# for the same `docs-sync/<package>/<tag>` branch.
concurrency:
  group: docs-sync-${{ github.event.client_payload.repo }}
  cancel-in-progress: false

jobs:
  propose:
    name: Propose docs for one release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Propose the docs update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run sync:release
